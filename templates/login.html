<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · School Day Grid</title><style>body{font-family:system-ui;background:#eef2f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 28px #0002;width:min(390px,88vw)}.logo{display:block;width:200px;height:auto;margin:0 auto 20px}input,button{width:100%;box-sizing:border-box;padding:11px;margin:7px 0}button{cursor:pointer}.fine{font-size:12px;color:#667085}</style></head><body><div class="card"><img class="logo" src="/static/images/school-day-grid-logo.png" alt="School Day Grid">{% if not has_users %}<h3>Create administrator</h3><p class="fine">Passwords are stored only as salted PBKDF2-HMAC-SHA256 hashes, never as plaintext.</p><form method="post" action="/setup-admin"><input name="username" placeholder="Username" required><input type="password" name="password" minlength="10" placeholder="Password" required><button>Create admin</button></form>{% else %}<h3>Sign in</h3><form method="post" action="/login"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Sign in</button></form>{% endif %}</div></body></html>
